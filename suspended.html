<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Tab Suspended</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
    color: #ededed;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 560px;
    width: 100%;
    text-align: center;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 48px 32px;
    backdrop-filter: blur(10px);
  }
  .icon { font-size: 64px; margin-bottom: 16px; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
  .url { font-size: 13px; color: #888; word-break: break-all; margin-bottom: 24px; }
  button {
    background: #fff; color: #000; border: none;
    padding: 12px 28px; border-radius: 999px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: transform .1s, background .2s;
  }
  button:hover { background: #e5e5e5; transform: translateY(-1px); }
  .hint { margin-top: 16px; font-size: 12px; color: #666; }
  .stats { margin-top: 24px; font-size: 12px; color: #555; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">💤</div>
    <h1>Tab Suspended</h1>
    <div class="url" id="url"></div>
    <button id="restore">Restore Tab</button>
    <p class="hint">This tab was suspended to save memory. Click restore or press Enter.</p>
    <p class="stats" id="stats"></p>
  </div>
  <script src="suspended.js"></script>
</body>
</html>
